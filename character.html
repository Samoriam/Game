<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      position: relative;
    }

    canvas {
      background: #16213e;
      border: 3px solid #0f3460;
      border-radius: 8px;
      position: relative;
      z-index: 1;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 2;
    }

    .panel {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1.6;
      min-width: 240px;
      max-width: 360px;
      box-sizing: border-box;
    }

    .panel strong {
      font-weight: bold;
    }

    #blue-panel {
      text-align: left;
    }

    #red-panel {
      text-align: right;
    }

    button {
      display: block;
      margin-top: 6px;
      width: 100%;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="blue-panel" class="panel">
      <strong>Blue</strong><br>
      Ammo: <span id="ammo2">12</span> / 12
      <button id="reload2">Reload Blue (F)</button><br>
      WASD = Move | Space = Jump | S = Crouch/Lay | F = Reload
    </div>

    <div id="red-panel" class="panel">
      <strong>Red</strong><br>
      Ammo: <span id="ammo1">12</span> / 12
      <button id="reload1">Reload Red (/)</button><br>
      Arrows = Move | Up = Jump | Down = Crouch/Lay | / = Reload
    </div>
  </div>

  <canvas id="game" width="900" height="600"></canvas>

  <!-- This loads your game logic -->
  <script src="game.js"></script>
</body>
</html>
