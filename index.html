<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      position: relative;
    }

    canvas {
      background: #16213e;
      border: 3px solid #0f3460;
      border-radius: 8px;
      position: relative;
      z-index: 1;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      pointer-events: none;
      z-index: 2;
    }

    .panel {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1.6;
      min-width: 240px;
      max-width: 360px;
      box-sizing: border-box;
    }

    .panel strong {
      font-weight: bold;
    }

    button {
      display: block;
      margin-top: 6px;
      width: 100%;
      font-size: 15px;
      cursor: pointer;
    }

    /* ===== CHARACTER SELECT ===== */
    #characterSelect {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      background: #1a1a2e;
      z-index: 10;
    }

    #characterSelect h1 {
      margin: 0;
      font-size: 28px;
    }

    .choices {
      display: flex;
      gap: 24px;
    }

    .choice {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 16px;
      width: 140px;
      cursor: pointer;
      color: white;
      font-family: inherit;
      font-size: 16px;
      text-align: center;
    }

    .choice:hover {
      border-color: white;
      background: rgba(255, 255, 255, 0.12);
    }

    .portrait {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 10px;
    }

    .portrait.red { background: #ff6b6b; }
    .portrait.blue { background: #6fb0ff; }

    #hud.hidden,
    canvas.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="characterSelect">
    <h1>Choose Your Character</h1>
    <div class="choices">
      <button class="choice" id="pickRed">
        <div class="portrait red"></div>
        Red
      </button>
      <button class="choice" id="pickBlue">
        <div class="portrait blue"></div>
        Blue
      </button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="panel">
      <strong>Player</strong><br>
      Ammo: <span id="ammo">20</span> / 20<br>
      Health: <span id="health">100</span>%<br>
      Score: <span id="score">0</span>
      <button id="reload">Reload (Shift)</button><br>
      Arrows = Move | Up = Jump | Down = Crouch/Lay | Space = Shoot | Shift = Reload<br>
      Watch for red birds - shooting one enrages it and it attacks! Shoot it again to finish it off. (-10% health per hit)
    </div>
  </div>

  <canvas id="game" width="900" height="600" class="hidden"></canvas>

  <!-- This loads your game logic -->
  <script src="Game.js"></script>
  <script>
    const characterSelect = document.getElementById("characterSelect");
    const hud = document.getElementById("hud");
    const gameCanvas = document.getElementById("game");

    function choose(character) {
      characterSelect.remove();
      hud.classList.remove("hidden");
      gameCanvas.classList.remove("hidden");
      startGame(character);
    }

    document.getElementById("pickRed").addEventListener("click", () => choose("red"));
    document.getElementById("pickBlue").addEventListener("click", () => choose("blue"));
  </script>
</body>
</html>
